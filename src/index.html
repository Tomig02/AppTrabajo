<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Document</title>
</head>
<body>
    <div class="base-gradient">
        <button id="printBtn" class="PrintBtn">Imprimir</button>
        
        <div class="input-row">
            <p>Tamaño en mm</p>
            <div class="input-options">
                <div class="option">
                    <label for="width">Horizontal</label>
                    <input type="number" name="width" id="Width"/>
                </div>
                <div class="option">
                    <label for="height">Vertical</label>
                    <input type="number" name="height" id="Height"/>
                </div>
                
            </div>
        </div>

        
        <!--<div class="container" id="Image-Container"></div> -->

        <div class="preview-component">
            <div id="print-preview" class="preview-page"></div>
        </div>
    </div>

    <script src="./popup.js"></script>
</body>
</html>
